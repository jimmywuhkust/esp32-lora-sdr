[platformio]
src_dir = examples
default_envs = xiao-s3

[env]
platform = espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = ESP32 LoRa SDR=symlink://.
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:xiao-s3]
build_src_filter = +<SerialBench/>

[env:xiao-send-once]
build_src_filter = +<SendOnce/>
