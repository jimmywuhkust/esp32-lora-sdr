  <g id="text_36">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #425465" transform="translate(59.472 325.001438)">Actual stationary board-pair measurements: BW203.125 kHz, 250 kcomplex samples/s, 4-bit components, 500-ms windows.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #425465" transform="translate(59.472 334.603625)">Separate fresh payload batches, four CRs, lengths 1/8/32; no RF retries. The 107th PSRAM attempt aborted on a ring edge.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #425465" transform="translate(59.472 344.205813)">Only completed windows form plotted denominators. Two earlier PSRAM batches also aborted; see all retained raw reports.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #425465" transform="translate(59.472 353.808)">100% reported output retention is not proof of every physical ADC sample, full-time coverage or continuous 4 MS/s USB.</text>
  </g>
 </g>
