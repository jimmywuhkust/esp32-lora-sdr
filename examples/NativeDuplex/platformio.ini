[platformio]
src_dir = main
default_envs = xiao-native

[env:xiao-native]
platform = espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.sdkconfig_defaults = ../../firmware/iq-capture/sdkconfig.defaults, ../../firmware/iq-capture/sdkconfig.psram

# Explicit opt-in: reply once with ACK:<received bytes> after a valid RX.
[env:xiao-echo]
extends = env:xiao-native
build_flags = -DLORA_SDR_ECHO_DEMO=1

# Optional serial bench for the two-board UI; same native MCU packet API.
[env:xiao-bench]
extends = env:xiao-native
build_flags = -DLORA_SDR_SERIAL_BENCH=1
